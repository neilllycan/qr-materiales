<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector QR</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family:"Arial Narrow", Arial, sans-serif;
    background:linear-gradient(to bottom,#B3B3FF 0%,#0000FF 50%,#00004D 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
}
.contenedor{
    margin:40px 0;
    width:520px;
    background:rgba(255,255,255,0.90);
    border-radius:15px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
}
h1{text-align:center;margin-top:0;}
video, canvas{width:100%;border:2px solid #0000FF;border-radius:10px;}
canvas{display:none;}
.estado{text-align:center;font-weight:bold;color:#0000AA;margin:15px 0;}
.fila{display:flex;align-items:center;margin-bottom:12px;}
.fila label{width:160px;font-size:18px;font-weight:bold;text-align:right;margin-right:10px;}
.fila input{flex:1;padding:8px;font-size:16px;font-family:"Arial Narrow",Arial,sans-serif;border:1px solid #999;border-radius:4px;background:#f3f3f3;}
.boton{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0;}
button{
    width:220px;height:50px;font-size:18px;font-family:"Arial Narrow",Arial,sans-serif;
    cursor:pointer;background:white;border:2px solid #0000FF;border-radius:8px;
}
input[type=file]{margin:15px 0;width:100%;}
</style>
</head>

<body>
<div class="contenedor">

<h1>Lector QR de Materiales</h1>

<div class="estado" id="estado">Presiona iniciar cámara</div>

<div class="boton">
    <button onclick="iniciarCamara()">Iniciar Cámara</button>
    <button onclick="location.reload()">Reiniciar</button>
</div>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<input type="file" accept="image/*" onchange="leerImagenQR(event)">

<div class="fila"><label>Código de Registro:</label><input id="codigoRegistro" readonly></div>
<div class="fila"><label>Fecha Producción:</label><input id="fechaProduccion" readonly></div>
<div class="fila"><label>Cantidad de Piezas:</label><input id="cantidadPiezas" readonly></div>
<div class="fila"><label>Material:</label><input id="material" readonly></div>
<div class="fila"><label>Dimensiones:</label><input id="dimensiones" readonly></div>
<div class="fila"><label>Espesor:</label><input id="espesor" readonly></div>
<div class="fila"><label>Color:</label><input id="color" readonly></div>
<div class="fila"><label>Cliente:</label><input id="cliente" readonly></div>
<div class="fila"><label>Textura:</label><input id="textura" readonly></div>

</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let escaneando = false;

function llenarCampos(textoQR){
    try{
        const datos = JSON.parse(textoQR);

        codigoRegistro.value = datos.codigoRegistro || "";
        fechaProduccion.value = datos.fechaProduccion || "";
        cantidadPiezas.value = datos.cantidadPiezas || "";
        material.value = datos.material || "";
        dimensiones.value = datos.dimensiones || "";
        espesor.value = datos.espesor || "";
        color.value = datos.color || "";
        cliente.value = datos.cliente || "";
        textura.value = datos.textura || "";

        estado.innerText = "QR leído correctamente";
        escaneando = false;
    }catch(e){
        estado.innerText = "El QR fue leído, pero no tiene el formato esperado";
    }
}

async function iniciarCamara(){
    estado.innerText = "Solicitando cámara...";

    try{
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();

        escaneando = true;
        estado.innerText = "Apunta la cámara al QR";
        requestAnimationFrame(escanear);
    }catch(error){
        estado.innerText = "No se pudo abrir la cámara. Revisa permisos y HTTPS.";
    }
}

function escanear(){
    if(!escaneando) return;

    if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imagen = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const codigo = jsQR(imagen.data, imagen.width, imagen.height, {
            inversionAttempts: "dontInvert"
        });

        if(codigo){
            llenarCampos(codigo.data);
            return;
        }
    }

    requestAnimationFrame(escanear);
}

function leerImagenQR(event){
    const archivo = event.target.files[0];
    if(!archivo) return;

    const img = new Image();
    img.onload = function(){
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imagen = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const codigo = jsQR(imagen.data, imagen.width, imagen.height);

        if(codigo){
            llenarCampos(codigo.data);
        }else{
            estado.innerText = "No se detectó QR en la imagen";
        }
    };

    img.src = URL.createObjectURL(archivo);
}
</script>

</body>
</html>
